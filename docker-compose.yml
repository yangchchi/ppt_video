services:
  app:
    build:
      context: .
      args:
        # 默认阿里云 apt 源；海外可设 APT_MIRROR=deb.debian.org
        APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
    ports:
      - "3780:3780"
    volumes:
      - ./data:/app/data
    environment:
      HOST: "0.0.0.0"
      PORT: "3780"
    restart: unless-stopped
